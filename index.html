<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ tự học IUH</title>
<meta name="description" content="3 địa điểm tự học quanh Trường Đại học Công nghiệp TP.HCM: vị trí trên Google Maps, chi phí, không gian và tiện ích.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0a4a9f;--brand2:#1c6fd1;--accent:#f7941d;
  --bg:#f2f6fb;--surface:#fff;--ink:#10243e;--muted:#4c6575;--line:#d3dde8;
  --lib:#0a4a9f;--cafe:#b8650a;--park:#1b7f46;--on:#fff;--logo:#153898;
  --mapbg:#e3ede7;--ring:#9fb8ad;--road:#d3e0d9;
}
@media (prefers-color-scheme:dark){
  :root{--brand:#12356b;--accent:#f7a93b;--bg:#0b1a22;--surface:#12262f;--ink:#e6f0ee;--muted:#9db3ba;--line:#264049;
  --lib:#6ea2ff;--cafe:#f0a93b;--park:#4cc27f;--on:#0b1a22;--logo:#fff;--mapbg:#0f2630;--ring:#3b5a63;--road:#17323c}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Be Vietnam Pro",system-ui,"Segoe UI",sans-serif}
a{color:var(--lib)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lib);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h2{font-size:1.65rem;font-weight:800;margin:0 0 6px;padding-left:12px;border-left:6px solid var(--accent);line-height:1.25}
.sub{margin:0 0 22px;color:var(--muted);max-width:68ch}
section{margin-top:64px}

/* thanh trên + menu */
.topbar{background:var(--brand);color:#fff;font-size:.82rem}
.topbar .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:7px;padding-bottom:7px}
.topbar a{color:#fff;margin-left:18px;text-decoration:none;font-weight:600}
.topbar a:hover{text-decoration:underline}
.nav{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:3px solid var(--accent)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:9px;padding-bottom:9px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;color:var(--ink);text-decoration:none}
.mark{height:38px;width:33px;display:block;flex:none}
.links{display:flex;gap:2px}
.links a{padding:8px 13px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.94rem;transition:background .15s}
.links a:hover{background:color-mix(in srgb,var(--lib) 12%,transparent)}
.links a[aria-current="true"]{color:var(--lib);box-shadow:inset 0 -3px 0 var(--accent)}
.burger{display:none;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600}
.burger svg{width:20px;height:20px}

/* đầu trang */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:18px;padding:44px 38px 38px;margin-top:22px}
.hero::after{content:"";position:absolute;right:-110px;top:-110px;width:380px;height:380px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);box-shadow:0 0 0 70px rgba(255,255,255,.05),0 0 0 140px rgba(255,255,255,.035);pointer-events:none;animation:spin 90s linear infinite}
.hero>*{position:relative;z-index:1}
.hero h1{font-weight:800;font-size:clamp(2.1rem,6vw,3.7rem);line-height:1.08;margin:0 0 14px;letter-spacing:-.02em;border-left:8px solid var(--accent);padding-left:16px}
.hero p{max-width:60ch;margin:0 0 20px;color:#dce8fb}
.facts{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0 0 24px;list-style:none}
.facts li{border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.hero .btn{border-color:#fff;color:#fff}
.hero .btn:hover{background:#fff;color:var(--brand)}
.hero .btn.fill{background:var(--accent);border-color:var(--accent);color:#1a1200}
.hero .btn.fill:hover{background:#fff;border-color:#fff;color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}

/* nút, chip */
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:.9rem;border-radius:10px;padding:8px 15px;border:1.5px solid var(--lib);color:var(--lib);background:transparent;cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:var(--lib);color:var(--on)}
.btn.fill{background:var(--lib);color:var(--on)}
.btn.fill:hover{opacity:.88}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;font-size:.92rem;transition:background .15s}
.chip:hover{border-color:var(--lib)}
.chip[aria-pressed="true"]{background:var(--lib);border-color:var(--lib);color:var(--on)}

/* bản đồ + danh sách */
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.mapbox{position:sticky;top:84px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1.5px solid var(--line)}
.maphead b{display:block;line-height:1.3}
.maphead small{color:var(--muted)}
.mapbox iframe{display:block;width:100%;height:min(560px,68vh);border:0;background:var(--bg)}
.mapbox [hidden]{display:none}
.seg{display:flex;gap:8px;padding:10px 16px;border-bottom:1.5px solid var(--line)}
.seg .chip{padding:5px 14px;font-size:.88rem}
#map{display:block;width:100%;height:auto;background:var(--mapbg);touch-action:manipulation}
.pin{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pin text{font:600 13px "Be Vietnam Pro",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--mapbg);stroke-width:4px;pointer-events:none}
.pin .dot{transition:r .15s}
.pin.on .dot{r:17}
.pin:focus{outline:none}
.pin:focus-visible .dot{stroke-width:6}
.ping,.halo{transform-box:fill-box;transform-origin:center}
.ping{animation:ping 2.8s ease-out infinite;fill:var(--ink)}
.halo{animation:ping 1.6s ease-out infinite}
.route{stroke-width:3;stroke-linecap:round;stroke-dasharray:1;animation:draw .7s ease-out both}
@keyframes ping{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.mapnote{margin:0;padding:10px 16px;font-size:.82rem;color:var(--muted);border-top:1.5px solid var(--line)}
.list{display:grid;gap:12px;padding:0;margin:0;list-style:none}
.card{background:var(--surface);border:1.5px solid var(--line);border-left:7px solid var(--c);border-radius:14px;padding:16px 18px;transition:box-shadow .2s,border-color .2s}
.card.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.card .sel{all:unset;cursor:pointer;display:block;width:100%}
.card .sel:focus-visible{outline:3px solid var(--lib);outline-offset:4px;border-radius:6px}
.tag{font-size:.82rem;font-weight:600;color:var(--c)}
.card h3{margin:0;font-size:1.1rem;font-weight:800}
.addr{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:12px 0 0;padding-top:12px;border-top:1.5px dashed var(--line);font-size:.88rem}
.info dt{color:var(--muted);font-size:.8rem}
.info dd{margin:0;font-weight:600}
.info dd.na{font-weight:400;color:var(--muted);font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* gợi ý địa điểm */
.rec{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px 22px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}
.rec h3{margin:0 0 2px;font-size:1.02rem}
.rec .hint{margin:0 0 10px;font-size:.84rem;color:var(--muted)}
.rec .chips{margin:0}
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--line)}
.rbar .note{flex:1;min-width:220px;margin:0;font-size:.82rem;color:var(--muted)}
.rlist{display:grid;gap:12px;margin:18px 0 0;padding:0;list-style:none}
.rlist .none{padding:16px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.rc{display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-left:7px solid var(--c);border-radius:14px;padding:14px 18px}
.rc.top{border-color:var(--c);box-shadow:0 0 0 2px var(--c);background:var(--surface)}
.rk{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--c);color:var(--on)}
.rc h4{margin:0;font-size:1.05rem;font-weight:800;line-height:1.3}
.rc .why{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.best{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:999px;background:var(--accent);color:#1a1200;font-size:.75rem;font-weight:700;vertical-align:middle}
.pc{text-align:right;font-weight:800;font-size:1.25rem;color:var(--c)}
.pc small{display:block;font-weight:600;font-size:.72rem;color:var(--muted)}
.meter{grid-column:2/4;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.rc .btns{grid-column:2/4;margin-top:6px}

/* tiêu chí */
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.crit li{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.crit svg{width:26px;height:26px;stroke:var(--lib);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.crit b{display:block}
.crit span{font-size:.88rem;color:var(--muted)}

/* tiến độ */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.steps li{background:var(--surface);border:1.5px solid var(--line);border-top:6px solid var(--line);border-radius:12px;padding:14px 16px}
.steps li.done{border-top-color:var(--park)}
.steps li.now{border-color:var(--accent);border-top-color:var(--accent)}
.steps b{display:block}
.steps .d{font-size:.85rem;color:var(--muted)}
.steps .st{display:inline-block;margin-top:8px;font-size:.8rem;font-weight:600;color:var(--muted)}
.steps li.done .st{color:var(--park)}
.steps li.now .st{color:var(--cafe)}

/* video */
.vgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:start}
.player{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0b1a22;border:1.5px solid var(--line)}
.player iframe,.player .face{position:absolute;inset:0;width:100%;height:100%;border:0}
.face{display:grid;place-items:center;cursor:pointer;background:#0b1a22 center/cover no-repeat;padding:0}
.face .play{width:76px;height:54px;border-radius:14px;background:var(--accent);display:grid;place-items:center;transition:transform .15s}
.face:hover .play{transform:scale(1.08)}
.face .play svg{width:26px;height:26px;fill:#1a1200}
.empty{position:absolute;inset:0;display:grid;place-content:center;gap:6px;text-align:center;color:#dce8fb;padding:20px}
.empty svg{width:48px;height:48px;margin:0 auto;stroke:#dce8fb;fill:none;stroke-width:1.6}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px}
.panel h3{margin:0 0 8px;font-size:1.05rem}
.panel ul{margin:0;padding-left:20px;color:var(--muted);font-size:.92rem}
.panel li+li{margin-top:4px}

/* thành viên */
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:0;padding:0;list-style:none}
.mem{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.mem.lead{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.av{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));border:2px solid var(--c)}
.av img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.mem h3{margin:0;font-size:1rem;line-height:1.3}
.mem .meta{margin:2px 0 8px;font-size:.82rem;color:var(--muted)}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.role{font-size:.78rem;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:1px 10px}
.role.lead{background:var(--accent);border-color:var(--accent);color:#1a1200}
.mem .tm{margin-top:8px;font-size:.8rem;font-weight:600;color:var(--c)}

/* đồ án */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:start}
.dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:.92rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.links2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lk{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:border-color .15s}
a.lk:hover{border-color:var(--lib)}
.lk svg{flex:none;width:26px;height:26px;stroke:var(--lib);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.lk b{display:block;line-height:1.3}
.lk span{font-size:.85rem;color:var(--muted)}
.lk.off{opacity:.62;border-style:dashed}
.lk.off svg{stroke:var(--muted)}

/* giới thiệu */
.intro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.intro .panel p{margin:0;color:var(--muted);font-size:.93rem}
.intro .panel{border-top:5px solid var(--accent)}
.introcta{margin-top:18px}

/* thuyết trình */
.deck{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.stage{container-type:inline-size;position:relative;aspect-ratio:16/9;background:var(--surface);overflow:hidden;outline:none}
.stage:focus-visible{box-shadow:inset 0 0 0 3px var(--lib)}
.slide{display:none;flex-direction:column;width:100%;height:100%;padding:max(16px,4cqw) max(18px,5cqw);font-size:clamp(13px,1.75cqw,36px);line-height:1.5;animation:sfade .35s ease-out both}
.slide.on{display:flex}
@keyframes sfade{from{opacity:0;transform:translateX(calc(var(--dir,1)*60px)) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.slide .kick{font-size:.85em;font-weight:600;color:var(--muted)}
.slide h3{margin:.1em 0 .6em;font-size:1.9em;font-weight:800;line-height:1.2;padding-left:.45em;border-left:.22em solid var(--accent)}
.sbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;padding-top:.4em}
.sb{margin:0;padding-left:1.2em;display:grid;gap:.55em;font-size:1.15em}
.sb li::marker{color:var(--accent)}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:.8em}
.sc{border:1.5px solid var(--line);border-left:.4em solid var(--c,var(--lib));border-radius:.7em;padding:.7em .95em;background:var(--bg)}
.sc b{display:block;line-height:1.3}
.sc .sd{display:block;margin-top:.15em;color:var(--muted);font-size:.85em}
.sc .stag{display:block;font-size:.8em;font-weight:600;color:var(--c,var(--lib))}
.sline{margin:.9em 0 0;font-weight:600}
.slide.cover{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;justify-content:center}
.slide.cover .kick{color:#dce8fb}
.slide.cover h3{font-size:3em;border-left-color:var(--accent);margin-bottom:.5em}
.slide.cover p{margin:.15em 0;color:#dce8fb;font-size:1.15em}
.dctl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1.5px solid var(--line)}
.dctl .btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.dots{flex:1;display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.dots button{width:11px;height:11px;padding:0;border-radius:50%;border:1.5px solid var(--lib);background:transparent;cursor:pointer}
.dots button[aria-current="true"]{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
#dNum{font-weight:600;font-size:.88rem;color:var(--muted);min-width:3.4em;text-align:center}
.notes{margin:0;padding:12px 16px;border-top:1.5px dashed var(--line);font-size:.9rem;color:var(--muted)}
.notes b{color:var(--ink)}
.deck:fullscreen{display:flex;flex-direction:column;border-radius:0;border:0;background:var(--bg)}
.deck:fullscreen .stage{aspect-ratio:auto;flex:1;min-height:0}
.deck:fullscreen .notes{display:none}
.deck:-webkit-full-screen{display:flex;flex-direction:column;border-radius:0;border:0;background:var(--bg)}
.deck:-webkit-full-screen .stage{aspect-ratio:auto;flex:1;min-height:0}
.deck:-webkit-full-screen .notes{display:none}

/* animation chủ đề IUH */
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.hero>.deco{position:absolute;z-index:0}
.dc{position:absolute;width:3.4em;height:3.4em;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;color:rgba(255,255,255,.2);animation:flo 7s ease-in-out infinite}
.d0{left:4%;top:60%;animation:spin 26s linear infinite}.d1{right:9%;top:12%;animation-delay:-2s}.d2{left:14%;bottom:8%;animation-delay:-4s}.d3{right:18%;bottom:12%;animation-delay:-1s}
.d4{left:48%;bottom:3%;width:2.4em;height:2.4em;animation:spin 20s linear infinite reverse}.d5{left:32%;top:6%;width:2.2em;height:2.2em;animation-delay:-3s}
@keyframes flo{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.slide.cover>*:not(.deco){z-index:1}
.slide.cover .sbody{max-width:58%}
.cvimg{position:absolute;right:5cqw;top:50%;transform:translateY(-50%);width:34%;height:60%}
.slot{border:2px dashed var(--line);border-radius:.8em;display:grid;place-items:center;color:var(--muted);font-size:.8em;text-align:center;padding:1em;min-height:7em;background:var(--bg)}
.slot img{width:100%;height:100%;object-fit:cover;border-radius:.6em;display:block}
.sc .slot{margin-bottom:.6em;min-height:5em}
.slide.cover .slot{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.1);color:#dce8fb}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:1em;align-items:stretch}
.split .sg{grid-template-columns:1fr}
.slide.on .rv{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*80ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.pbar{position:absolute;left:0;top:0;height:4px;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1);z-index:3}
.big{font-size:2.2em;font-weight:800;line-height:1.1;color:var(--c,var(--lib))}
.ban{padding:.8em 1em;border-radius:.7em;background:var(--brand);color:#fff;font-weight:800;text-align:center;margin:.4em 0 .8em;font-size:1.05em}
.tw{overflow:auto}.tb{width:100%;border-collapse:collapse;font-size:.8em}
.tb th{background:var(--brand);color:#fff;text-align:left;padding:.45em .8em}
.tb td{padding:.3em .8em;border-bottom:1.5px solid var(--line)}.tb tr:nth-child(even) td{background:var(--bg)}
.gt{display:grid;gap:.8em}.gr{display:grid;grid-template-columns:minmax(7em,11em) 1fr;gap:.8em;align-items:center}
.gl{font-weight:600}.gtrack{height:2.4em;background:var(--bg);border:1.5px solid var(--line);border-radius:.5em;overflow:hidden}
.gbar{display:grid;place-items:center;height:100%;border-radius:.4em;background:var(--lib);color:var(--on);font-size:.8em;font-style:normal;font-weight:600;white-space:nowrap;transform-origin:left}
